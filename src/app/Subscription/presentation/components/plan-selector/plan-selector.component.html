
<mat-form-field appearance="fill" class="w-full">
  <mat-label>{{ label }}</mat-label>

  <mat-select [value]="value" (selectionChange)="onSelectionChange($event)" [disabled]="isDisabled">

    <mat-option *ngFor="let plan of plans" [value]="plan.id">
      {{ plan.name }}
    </mat-option>
  </mat-select>
</mat-form-field>
